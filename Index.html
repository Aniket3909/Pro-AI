<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AI - AI App Generator & Problem Solver</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>Pro AI</span>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#generator">App Generator</a></li>
                <li><a href="#solver">Problem Solver</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Build Apps Instantly with AI</h1>
            <p>Describe your app idea → Get complete working code instantly</p>
            <div class="cta-buttons">
                <a href="#generator" class="btn-primary">Generate App Now</a>
                <a href="#solver" class="btn-secondary">Solve Problems</a>
            </div>
        </div>
    </section>

    <!-- App Generator -->
    <section id="generator" class="generator-section">
        <div class="container">
            <h2><i class="fas fa-magic"></i> AI App Generator</h2>
            <div class="generator-box">
                <textarea id="appPrompt" placeholder="Describe your app... 
Example: 'Create a todo list app with dark mode, drag & drop, local storage, and beautiful UI'"></textarea>
                <div class="generate-buttons">
                    <button id="generateApp" class="btn-primary">
                        <i class="fas fa-rocket"></i> Generate App
                    </button>
                    <button id="downloadApp" class="btn-secondary" disabled>
                        <i class="fas fa-download"></i> Download ZIP
                    </button>
                </div>
            </div>
            
            <!-- Generated App Preview -->
            <div id="appPreview" class="app-preview hidden">
                <h3>✅ Your App is Ready!</h3>
                <iframe id="previewFrame" src="about:blank"></iframe>
                <div class="preview-controls">
                    <button id="runApp" class="btn-primary">Run App</button>
                    <button id="copyCode" class="btn-secondary">Copy Code</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Problem Solver -->
    <section id="solver" class="solver-section">
        <div class="container">
            <h2><i class="fas fa-lightbulb"></i> AI Problem Solver</h2>
            <div class="solver-box">
                <textarea id="problemPrompt" placeholder="Ask any question or describe your problem...
Example: 'How do I fix CORS error in React app?'"></textarea>
                <button id="solveProblem" class="btn-primary">
                    <i class="fas fa-solve"></i> Solve Now
                </button>
                <div id="solutionOutput" class="solution-output"></div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="app-generator.js"></script>
</body>
</html>
